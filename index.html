<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Härteliste Scanner</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    :root{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#374151}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;background:rgba(15,23,42,.96);backdrop-filter:blur(8px);z-index:2;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
    h1{font-size:20px;margin:0 0 10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.num{font-size:22px;font-weight:800}.label{font-size:12px;color:var(--muted)}
    main{padding:14px;max-width:980px;margin:auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
    video{width:100%;max-height:45vh;border-radius:12px;background:#000;object-fit:cover;border:1px solid var(--line)}
    button,input,select{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px;background:#1f2937;color:var(--text)}
    button{font-weight:700;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}button.ok{background:var(--ok);border-color:var(--ok)}button.bad{background:var(--bad);border-color:var(--bad)}
    .row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#1f2937}.msg.ok{background:#064e3b}.msg.bad{background:#7f1d1d}.msg.warn{background:#78350f}
    table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left}th{position:sticky;top:96px;background:#111827;z-index:1}tr.checked{background:rgba(22,163,74,.18)}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#374151}.pill.ok{background:#166534}.small{font-size:12px;color:var(--muted)}
    @media(max-width:650px){th:nth-child(3),td:nth-child(3){display:none}th{top:102px}.stats{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
<header>
  <h1>Härteliste Scanner</h1>
  <div class="stats">
    <div class="stat"><div class="num" id="total">0</div><div class="label">Gesamt</div></div>
    <div class="stat"><div class="num" id="done">0</div><div class="label">Vor Ort</div></div>
    <div class="stat"><div class="num" id="open">0</div><div class="label">Fehlt</div></div>
  </div>
</header>
<main>
  <section class="panel">
    <video id="video" muted playsinline></video>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="startBtn">Scanner starten</button>
      <button id="stopBtn">Stoppen</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="manual" inputmode="numeric" placeholder="Nummer manuell eingeben, z. B. 580393">
      <button class="ok" id="manualBtn">Abhaken</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="search" placeholder="Suchen: Nummer / Charge / Lagerort">
      <select id="filter"><option value="all">Alle</option><option value="open">Nur fehlende</option><option value="done">Nur abgehakte</option></select>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="exportBtn">CSV exportieren</button>
      <button class="bad" id="resetBtn">Alle Haken löschen</button>
    </div>
    <div id="msg" class="msg">Bereit. Auf dem iPhone muss die Seite über HTTPS geöffnet werden, sonst blockiert iOS oft die Kamera.</div>
  </section>
  <section class="panel">
    <table>
      <thead><tr><th>Status</th><th>Lfd. Nr.</th><th>Charge</th><th>Härte HBW</th><th>Lagerort</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

    return `<tr class="${isDone?'checked':''}" onclick="toggle('${p.nummer}')">
      <td><span class="pill ${isDone?'ok':''}">${isDone?'✓ da':'fehlt'}</span></td>
      <td><b>${p.nummer}</b></td><td>${p.charge}</td><td>${p.haerte}</td><td>${p.lagerort||'<span class="small">—</span>'}</td>
    </tr>`;
  }).join("");
}
window.toggle = function(n){ checked.has(n) ? checked.delete(n) : checked.add(n); save(); render(); };

async function startScanner(){
  if(scanning) return;
  scanning = true;
  setMsg("Scanner läuft. Barcode ruhig und hell vor die Kamera halten.");
  try{
    if(window.ZXing){
      codeReader = new ZXing.BrowserMultiFormatReader();
      const devices = await codeReader.listVideoInputDevices();
      const back = devices.find(d => /back|rear|environment|rück/i.test(d.label)) || devices[devices.length-1];
      await codeReader.decodeFromVideoDevice(back && back.deviceId, "video", (result, err) => {
        if(result) scanValue(result.text);
      });
    } else if("BarcodeDetector" in window){
      const detector = new BarcodeDetector({formats:["code_128","code_39","ean_13","ean_8","qr_code","data_matrix"]});
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      $("video").srcObject = stream; await $("video").play();
      const loop = async () => {
        if(!scanning) return;
        const codes = await detector.detect($("video")).catch(()=>[]);
        if(codes[0]) scanValue(codes[0].rawValue);
        requestAnimationFrame(loop);
      };
      loop();
    } else {
      setMsg("Dieser Browser unterstützt keinen Barcode-Scanner. Nutze Safari/Chrome aktuell oder gib manuell ein.", "bad");
    }
  } catch(e){ scanning=false; setMsg("Kamera konnte nicht gestartet werden: " + e.message, "bad"); }
}
function stopScanner(){
  scanning=false;
  if(codeReader){ codeReader.reset(); codeReader=null; }
  const v=$("video"); if(v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; }
  setMsg("Scanner gestoppt.");
}
$("startBtn").onclick=startScanner; $("stopBtn").onclick=stopScanner;
$("manualBtn").onclick=()=>{ scanValue($("manual").value); $("manual").value=""; };
$("manual").addEventListener("keydown",e=>{ if(e.key==="Enter") $("manualBtn").click(); });
$("search").oninput=render; $("filter").onchange=render;
$("resetBtn").onclick=()=>{ if(confirm("Wirklich alle Haken löschen?")){ checked.clear(); save(); render(); setMsg("Alle Haken gelöscht.","warn"); } };
$("exportBtn").onclick=()=>{
  const csv = ["Laufende Nummer;Charge;Härte HBW;Lagerort;Status"].concat(PARTS.map(p => [p.nummer,p.charge,p.haerte,p.lagerort,checked.has(p.nummer)?"vor Ort":"fehlt"].map(x=>`"${String(x).replaceAll('"','""')}"`).join(";"))).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="haerteliste_status.csv"; a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
